name: Free RAG worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: provenance-free-rag-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      clamav:
        image: clamav/clamav:1.5.4
        ports:
          - 3310:3310
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      EMBEDDING_DIMENSIONS: "1536"
      WORKER_BATCH_SIZE: "4"
      WORKER_ONESHOT: "true"
      MALWARE_SCAN_REQUIRED: "true"
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      MAX_SOURCE_BYTES: "52428800"

    steps:
      - name: Check free-tier worker configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$DATABASE_URL" && -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" && -n "$GEMINI_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker secrets are not configured yet; skipping without a paid fallback."
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml

      - name: Install worker
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        run: |
          python -m pip install --upgrade pip
          pip install . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Wait for ClamAV
        if: steps.config.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import socket, time
          for attempt in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 3310), timeout=2):
                      print("ClamAV is ready")
                      raise SystemExit(0)
              except OSError:
                  time.sleep(2)
          raise SystemExit("ClamAV did not become ready")
          PY

      - name: Refresh due authoritative sources
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        run: grounded-refresh-due

      - name: Process queued documents
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        run: grounded-worker
